name: Verify published journey in Chrome
on:
  push:
    branches: ['qa/loading-6104']
    paths: ['.github/workflows/verify-published-6106.yml']
permissions:
  contents: read
jobs:
  online:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Open the actual Pages site in Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/nanlan-live" playwright@1.55.0
          NODE_PATH="$RUNNER_TEMP/nanlan-live/node_modules" node <<'JS'
          const {chromium}=require('playwright'),assert=require('node:assert/strict');
          (async()=>{
            const b=await chromium.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--mute-audio']});
            try{
              const p=await b.newPage({viewport:{width:1024,height:768},hasTouch:true});
              const url='https://isabellajtian1-cloud.github.io/nanlan-ji/?v=6106&build=40110e7';
              p.on('pageerror',err=>console.log('Page exception:',err.message));
              for(let i=0;i<30;i++){
                await p.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
                console.log('Public title',await p.title());if((await p.title()).includes('6.10.6'))break;
                await p.waitForTimeout(8000);
              }
              assert.match(await p.title(),/6\.10\.6/);
              const errors=[];p.on('pageerror',e=>errors.push(e.message));
              await p.waitForFunction(()=>document.getElementById('bootStatus').hidden,{},{timeout:60000});
              console.log('Boot ready');await p.click('#begin');await p.click('#characterConfirm');await p.waitForFunction(()=>started&&images.gate?.naturalWidth);
              await p.click('#openingSkip');await p.waitForFunction(()=>!NanlanOpening.running());
              await p.evaluate(()=>{
                const person=world.gate.objects.find(o=>o.id==='familyLuggage');engine.move(person.x,person.y);
                for(const [name,args] of [['handover',{choice:'grandfather'}],['takeKey',{}],['openGate',{}]]){
                  const result=engine.act(name,args);if(!result.ok)throw Error(result.message);
                }
              });
              await p.reload({waitUntil:'domcontentloaded'});await p.click('#continueGame');await p.waitForFunction(()=>started&&state().scene==='yard'&&images.stove?.naturalWidth&&images.waterJar?.naturalWidth);
              assert.deepEqual(errors,[]);console.log('Public entry verified:',await p.title(),p.url(),await p.evaluate(()=>state().scene));
            } finally {await b.close();}
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
