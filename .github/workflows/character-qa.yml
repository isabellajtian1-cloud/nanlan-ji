name: Check character rendering
on:
  push:
    branches: [character-art-6105]
permissions:
  contents: write
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet playwright pillow numpy opencv-python-headless
      - run: python .art-qa/prepare.py
      - run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/nanlan-qa.log 2>&1 &
          python .art-qa/browser.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .art-qa figure-female-plain-6105.webp
          git commit -m "Record character overlap and outfit checks"
          git push origin HEAD:character-art-6105
          python -c "import json; assert json.load(open('.art-qa/report.json'))['ok']"
