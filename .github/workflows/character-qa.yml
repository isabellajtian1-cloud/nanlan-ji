name: Verify published game and download
on:
  push:
    branches: [character-art-6105]
permissions:
  contents: write
  actions: read
  pages: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python -m pip install --quiet playwright
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python .art-qa/public.py 04a2892718b5ad75cc8800485f84e9c9bcd9bbb3
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .art-qa/public.json
          git commit -m "Record public play and full archive verification"
          git push origin HEAD:character-art-6105
          python -c "import json; r=json.load(open('.art-qa/public.json')); assert r.get('zip_verified') and r.get('online')"
