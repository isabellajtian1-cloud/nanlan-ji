name: Prepare loading test artwork
on:
  push:
    branches: ['qa/loading-6104']
    paths: ['.github/workflows/loading-art-6104.yml']
permissions:
  contents: write
jobs:
  artwork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Encode the original game art and verify dimensions and transparency
        run: |
          python -m pip install Pillow
          python - <<'PY'
          from PIL import Image, ImageChops
          from pathlib import Path
          names = 'bed-damage-v39 store-pickups-v39 inventory-household-v392 inventory-crafts-v392 garden-stages-v6914 water-jar-v6914 stove-v6914 npc-idle-v3911 fruit-trees-v394 fruit-trees-picked-v394 toolbar-ming-v394 family-meal-female-v394 family-meal-male-v394 seals-v398 production-items-v399 production-stages-v399 family-silk-v399 player-female-silk-v399 player-male-silk-v399'.split()
          for name in names:
              im = Image.open(name + '.png')
              dest = Path(name + '.webp')
              assert not dest.exists(), dest
              im.save(dest, 'WEBP', quality=87, alpha_quality=100, method=5)
              out = Image.open(dest)
              assert out.size == im.size
              assert ImageChops.difference(out.convert('RGBA').getchannel('A'), im.convert('RGBA').getchannel('A')).getbbox() is None
          PY
          git add -- bed-damage-v39.webp store-pickups-v39.webp inventory-household-v392.webp inventory-crafts-v392.webp garden-stages-v6914.webp water-jar-v6914.webp stove-v6914.webp npc-idle-v3911.webp fruit-trees-v394.webp fruit-trees-picked-v394.webp toolbar-ming-v394.webp family-meal-female-v394.webp family-meal-male-v394.webp seals-v398.webp production-items-v399.webp production-stages-v399.webp family-silk-v399.webp player-female-silk-v399.webp player-male-silk-v399.webp
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Prepare checked WebP copies for slow-connection test"
          git push origin HEAD:qa/loading-6104
