name: Verify published game and download
on:
  push:
    branches: [character-art-6105]
    paths-ignore:
      - '.art-qa/*.json'
      - '.art-qa/*.png'
permissions:
  contents: read
concurrency:
  group: verify-published-character-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install browser test driver
        run: python -m pip install --quiet playwright
      - name: Check the public game and source archive
        env:
          PUBLISH_BRANCH: ${{ github.event.repository.default_branch }}
        run: python .art-qa/public.py
      - name: Save verification report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: published-game-verification
          path: public-verification.json
          if-no-files-found: ignore
