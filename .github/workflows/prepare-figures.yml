name: Prepare character artwork
on:
  push:
    branches: [character-art-6105]
permissions:
  contents: write
jobs:
  artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pillow numpy opencv-python-headless
      - run: python .art-qa/prepare.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- figure-*-6105.webp
          git commit -m "Render four high-resolution character sheets"
          git push origin HEAD:character-art-6105
